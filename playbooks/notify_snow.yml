---
- name: Incidents | Update ServiceNow Ticket
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    snow_state_map:
      impact_analysis: "2"
      escalated: "3"
      resolved: "6"
      default: ""

  tasks:
    - name: Look up SNOW ticket sys_id by number
      ansible.builtin.uri:
        url: "{{ snow_instance_url }}/api/now/table/incident?sysparm_query=number={{ ticket_id }}&sysparm_fields=sys_id,number,state&sysparm_limit=1"
        method: GET
        user: "{{ snow_username }}"
        password: "{{ snow_password }}"
        force_basic_auth: true
        headers:
          Accept: "application/json"
        status_code: 200
      register: snow_lookup

    - name: Fail if ticket not found
      ansible.builtin.fail:
        msg: "ServiceNow ticket {{ ticket_id }} not found"
      when: snow_lookup.json.result | length == 0

    - name: Set ticket sys_id
      ansible.builtin.set_fact:
        snow_sys_id: "{{ snow_lookup.json.result[0].sys_id }}"
        snow_current_state: "{{ snow_lookup.json.result[0].state }}"

    - name: Build work note content
      ansible.builtin.set_fact:
        work_note_body: |
          [{{ notification_title | default('AO Automation Update') }}]

          {{ notification_body | default('') }}

    - name: Post work note to SNOW ticket
      ansible.builtin.uri:
        url: "{{ snow_instance_url }}/api/now/table/incident/{{ snow_sys_id }}"
        method: PATCH
        user: "{{ snow_username }}"
        password: "{{ snow_password }}"
        force_basic_auth: true
        headers:
          Content-Type: "application/json"
          Accept: "application/json"
        body_format: json
        body:
          work_notes: "{{ work_note_body }}"
          state: "{{ snow_ticket_state | default('') if snow_ticket_state | default('') else omit }}"
        status_code: 200
      register: snow_update

    - name: Log result
      ansible.builtin.debug:
        msg: |
          ServiceNow ticket {{ ticket_id }} updated.
          State: {{ snow_update.json.result.state }}
          URL: {{ snow_instance_url }}/nav_to.do?uri=incident.do?sys_id={{ snow_sys_id }}
