---
- name: Incidents | Update ServiceNow Ticket
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Look up SNOW ticket sys_id by number
      ansible.builtin.uri:
        url: "{{ snow_instance_url }}/api/now/table/incident?sysparm_query=number={{ ticket_id }}&sysparm_fields=sys_id,number,state,description&sysparm_limit=1"
        method: GET
        user: "{{ snow_username }}"
        password: "{{ snow_password }}"
        force_basic_auth: true
        headers:
          Accept: "application/json"
        status_code: 200
      register: snow_lookup

    - name: Fail if ticket not found
      ansible.builtin.fail:
        msg: "ServiceNow ticket {{ ticket_id }} not found"
      when: snow_lookup.json.result | length == 0

    - name: Set ticket sys_id
      ansible.builtin.set_fact:
        snow_sys_id: "{{ snow_lookup.json.result[0].sys_id }}"

    - name: Build updated description
      ansible.builtin.set_fact:
        updated_description: |
          {{ snow_lookup.json.result[0].description }}

          ---
          [{{ notification_title | default('AO Automation Update') }}]

          {{ notification_body | default('') }}

    - name: Build SNOW update payload
      ansible.builtin.set_fact:
        snow_payload: >-
          {%- set payload = {"description": updated_description} -%}
          {%- if snow_ticket_state | default('') -%}
            {%- set _ = payload.update({"state": snow_ticket_state}) -%}
          {%- endif -%}
          {%- if snow_ticket_state | default('') == '6' -%}
            {%- set _ = payload.update({
              "close_code": "Solved (Permanently)",
              "close_notes": notification_body | default('Resolved by automated remediation.')
            }) -%}
          {%- endif -%}
          {{ payload }}

    - name: Update SNOW ticket
      ansible.builtin.uri:
        url: "{{ snow_instance_url }}/api/now/table/incident/{{ snow_sys_id }}"
        method: PATCH
        user: "{{ snow_username }}"
        password: "{{ snow_password }}"
        force_basic_auth: true
        headers:
          Content-Type: "application/json"
          Accept: "application/json"
        body_format: json
        body: "{{ snow_payload }}"
        status_code: 200
      register: snow_update

    - name: Log result
      ansible.builtin.debug:
        msg: |
          ServiceNow ticket {{ ticket_id }} updated.
          State: {{ snow_update.json.result.state }}
          URL: {{ snow_instance_url }}/nav_to.do?uri=incident.do?sys_id={{ snow_sys_id }}
